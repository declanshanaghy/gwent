<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1280" height="720" fill="#2a2a2a" rx="10" ry="10"/>
    
    <!-- Decorative Elements -->
    <rect x="0" y="0" width="1280" height="20" fill="#6d1a36" opacity="0.3"/>
    <rect x="0" y="700" width="1280" height="20" fill="#6d1a36" opacity="0.3"/>
    <rect x="0" y="0" width="20" height="720" fill="#6d1a36" opacity="0.3"/>
    <rect x="1260" y="0" width="20" height="720" fill="#6d1a36" opacity="0.3"/>
    
    <!-- RFID Waves (Static) -->
    <circle cx="300" cy="360" r="180" fill="none" stroke="#6d1a36" stroke-width="4" stroke-opacity="0.2"/>
    <circle cx="300" cy="360" r="140" fill="none" stroke="#6d1a36" stroke-width="4" stroke-opacity="0.3"/>
    <circle cx="300" cy="360" r="100" fill="none" stroke="#6d1a36" stroke-width="4" stroke-opacity="0.4"/>
    
    <!-- Cards -->
    <g transform="translate(980, 360) rotate(15)">
        <rect x="-80" y="-120" width="160" height="240" rx="16" ry="16" fill="url(#cardGradient1)" stroke="white" stroke-width="3"/>
        <rect x="-60" y="-100" width="120" height="200" rx="8" ry="8" fill="rgba(255, 255, 255, 0.1)"/>
    </g>
    
    <g transform="translate(900, 320) rotate(-5)">
        <rect x="-70" y="-105" width="140" height="210" rx="14" ry="14" fill="url(#cardGradient2)" stroke="white" stroke-width="2" opacity="0.7"/>
        <rect x="-50" y="-85" width="100" height="170" rx="7" ry="7" fill="rgba(255, 255, 255, 0.1)"/>
    </g>
    
    <!-- Circuit Board Pattern -->
    <path d="M50,50 L100,50 L100,100 L150,100 L150,150 L200,150 L200,200" 
          stroke="#d4af37" stroke-width="2" fill="none" stroke-opacity="0.3"/>
    <path d="M1230,670 L1180,670 L1180,620 L1130,620 L1130,570 L1080,570 L1080,520" 
          stroke="#d4af37" stroke-width="2" fill="none" stroke-opacity="0.3"/>
    
    <!-- Main Logo Text -->
    <text x="640" y="320" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">GWENT</text>
    
    <!-- Tagline -->
    <text x="640" y="400" font-family="Arial, sans-serif" font-size="36" font-style="italic" text-anchor="middle" fill="#d4af37">Cards &amp; Circuits: The Digital Companion</text>
    
    <!-- Raspberry Pi Emoji -->
    <text x="1100" y="600" font-family="Arial, sans-serif" font-size="48" transform="rotate(-10, 1100, 600)">🥧</text>
    
    <!-- RFID Icon -->
    <g transform="translate(300, 360)">
        <rect x="-30" y="-20" width="60" height="40" rx="5" ry="5" fill="#d4af37" opacity="0.7"/>
        <rect x="-20" y="-10" width="40" height="20" rx="2" ry="2" fill="#2a2a2a"/>
        <circle cx="20" cy="0" r="5" fill="#6d1a36"/>
    </g>
    
    <!-- Gradients -->
    <defs>
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6d1a36"/>
            <stop offset="100%" stop-color="#d4af37"/>
        </linearGradient>
        <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#6d1a36"/>
        </linearGradient>
        <linearGradient id="cardGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#6d1a36"/>
        </linearGradient>
    </defs>
</svg>