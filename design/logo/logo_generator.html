<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwent Companion Logo Generator</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        
        .logo-container {
            width: 500px;
            height: 500px;
            background-color: #2a2a2a;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .logo-text {
            font-size: 72px;
            font-weight: bold;
            background: linear-gradient(45deg, #6d1a36, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 2;
            letter-spacing: 2px;
        }
        
        .tagline {
            font-size: 18px;
            color: #d4af37;
            margin-top: 10px;
            font-style: italic;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #d4af37, #6d1a36);
            border-radius: 8px;
            position: absolute;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: rotate(15deg);
            right: 100px;
            top: 150px;
            z-index: 1;
            border: 2px solid #fff;
        }
        
        .card:before {
            content: "";
            position: absolute;
            width: 60px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            top: 10px;
            left: 10px;
        }
        
        .rfid-wave {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 3px solid transparent;
            border-radius: 50%;
            left: 100px;
            top: 150px;
            z-index: 0;
        }
        
        .wave1 {
            border-color: rgba(109, 26, 54, 0.3);
            animation: pulse 2s infinite;
        }
        
        .wave2 {
            width: 120px;
            height: 120px;
            border-color: rgba(109, 26, 54, 0.5);
            animation: pulse 2s infinite 0.3s;
        }
        
        .wave3 {
            width: 90px;
            height: 90px;
            border-color: rgba(109, 26, 54, 0.7);
            animation: pulse 2s infinite 0.6s;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }
        
        .instructions {
            position: fixed;
            bottom: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .raspberry {
            position: absolute;
            font-size: 24px;
            bottom: 100px;
            right: 140px;
            transform: rotate(-10deg);
        }
        
        .download-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #6d1a36;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .download-btn:hover {
            background-color: #8a2245;
        }
    </style>
</head>
<body>
    <div class="logo-container" id="logo">
        <div class="logo-text">GWENT</div>
        <div class="tagline">Cards & Circuits: The Digital Companion</div>
        <div class="card"></div>
        <div class="rfid-wave wave1"></div>
        <div class="rfid-wave wave2"></div>
        <div class="rfid-wave wave3"></div>
        <div class="raspberry">🥧</div>
    </div>
    
    <div class="instructions">
        To save as PNG: Right-click on the logo and select "Save image as..." or use the Download button
    </div>
    
    <button class="download-btn" id="downloadBtn">Download Logo</button>
    
    <!-- Load html2canvas library first -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <script>
        // Wait for the page to fully load before setting up the download button
        window.onload = function() {
            document.getElementById('downloadBtn').addEventListener('click', function() {
                // Create a canvas element
                const canvas = document.createElement('canvas');
                canvas.width = 500;
                canvas.height = 500;
                const ctx = canvas.getContext('2d');
                
                // Draw a background
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Use html2canvas to capture the logo
                html2canvas(document.getElementById('logo')).then(function(logoCanvas) {
                    // Draw the captured logo onto our canvas
                    ctx.drawImage(logoCanvas, 0, 0);
                    
                    // Convert to data URL and trigger download
                    const dataURL = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = 'gwent_logo.png';
                    link.href = dataURL;
                    link.click();
                });
            });
        };
    </script>
</body>
</html>
