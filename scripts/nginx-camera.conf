# Gwent camera endpoints — reverse proxy to camera-server.py (gwent-camera.service)
#
#   http://<pi>/camera/still        -> single JPEG frame
#   http://<pi>/camera/stream       -> live MJPEG stream
#   http://<pi>/camera/recordings/  -> browse/download game recordings (mp4)
#
# Installed by scripts/install-system.sh as
# /etc/nginx/sites-available/gwent-camera (replaces the stock default site).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Game recordings served straight off disk, read-only. Users download
    # saved games from here before confirming their deletion when the
    # 10GB recordings budget fills up.
    location /camera/recordings/ {
        alias /home/dshanaghy/src/github.com/declanshanaghy/gwent/tmp/recordings/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    location /camera/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        # The MJPEG stream is an unbounded multipart response — never buffer
        # it, and keep the connection open as long as the client watches.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404 "gwent: use /camera/still or /camera/stream\n";
    }
}
